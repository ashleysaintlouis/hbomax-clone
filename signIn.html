<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin HBO</title>
    <link rel="stylesheet" href="assets/css/signIn.css">
</head>
<body>
    <header>
        <nav class="navbar menu">
            <div class="container-fluid menu__logo ">
                <a class="navbar-brand" href="#">
                    <img class="menu__logo-image" src="assets/images/hbo-logo.svg" alt="">
                </a>
            </div>
            <div class="container-fluid">
                <a class="menu__item" href="./signIn.html">Entrar</a>
                <button type="button" class="menu__item button menu__item--button">Assine agora</button>
            </div>
        </nav>
    </header>
    <main class="content">
            <form class="login" action="post">
                <h1 class="login__title">Entrar</h1>
                <label class="login__label">Você tem uma conta da HBO Max?</label>
                <input class="login__field" placeholder="Endereço de e-mail" type="email">
                <input class="login__field" placeholder="Senha" type="password">

                <div>
                    <button class="button button--gradient">Entrar</button>
                    <a class="login__link">Esqueceu a senha?</a>
                </div>
        </form>
    </main>
    <footer class="container">
        <nav class="footer__legal">
            <div>
                <a class="footer__link" href="">Agora na HBO Max </a>
                <a class="footer__link" href="">Em breve</a>
                <a class="footer__link" href="">Filme em destaque</a>
                <a class="footer__link" href="">Séries</a>
                <a class="footer__link" href="">Ajuda</a> 
            </div>
            
            <p>© 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.</p>

            <div class="footer__social">
                <img src="assets/images/fb_0.png" alt="Icone de Facebook">
                <img src="assets/images/twitter_0.png" alt="Icone de Twitter">
                <img src="assets/images/instagram_0.png" alt="Icone de Instagram">
                <img src="assets/images/youtube_0.png" alt="Icone de Youtube">
            </div>
        </nav>
</footer>
</body>
</html>
